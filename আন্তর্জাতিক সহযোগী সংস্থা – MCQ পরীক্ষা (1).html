const L=["ক","খ","গ","ঘ"],bn=n=>String(n).replace(/\d/g,d=>"০১২৩৪৫৬৭৮৯"[d]),A={},$=i=>document.getElementById(i);
let name="";

$("st").hidden=1;$("qz").hidden=0;
$("ql").innerHTML=Q.map((q,i)=>{const p=q[0].split("|");return`<div class="c"><b>${bn(i+1)}. ${p[0]}</b>`+p.slice(1).map((o,j)=>`<label class="o" id="o${i}_${j}" onclick="pick(${i},${j})">${L[j]}) ${o}</label>`).join("")+`</div>`}).join("");upd()}
function pick(i,j){A[i]=j;for(let k=0;k<4;k++)$("o"+i+"_"+k).classList.toggle("s",k==j);upd()}
function upd(){$("bar").textContent="উত্তর দেওয়া হয়েছে: "+bn(Object.keys(A).length)+"/৫০"}
function fin(){const n=Object.keys(A).length;if(n<50&&!confirm("এখনও "+bn(50-n)+"টি প্রশ্নের উত্তর দাওনি। তবুও জমা দেবে?"))return;
let s=0;Q.forEach((q,i)=>{const c=q[1];if(A[i]===c)s++;
for(let k=0;k<4;k++){const e=$("o"+i+"_"+k);e.onclick=null;e.classList.remove("s");if(k==c)e.classList.add("ok");else if(k==A[i])e.classList.add("no")}});
$("qz").querySelector("button").hidden=1;$("bar").hidden=1;
$("rs").hidden=0;$("rs").innerHTML=`<div class="c"><p>${name}</p><div class="big">${bn(s)} / ৫০</div><p style="text-align:center">ভুল: ${bn(Object.keys(A).filter(i=>A[i]!==Q[i][1]).length)}টি | উত্তর দেওয়া হয়নি: ${bn(50-n)}টি</p><p style="text-align:center">নিচে সবুজ = সঠিক উত্তর, লাল = তোমার ভুল উত্তর</p></div>`;
